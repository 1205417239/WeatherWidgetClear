name: Build Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz make dpkg
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Setup iOS SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          SDK_NAME=$(basename "$SDK_PATH")
          echo "Using SDK: $SDK_NAME at $SDK_PATH"
          ln -sf "$SDK_PATH" "$THEOS/sdks/$SDK_NAME"
          ls -la $THEOS/sdks/

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Extract dylib
        run: |
          mkdir -p output
          cp packages/*.deb output/ 2>/dev/null
          cd output
          for deb in *.deb; do
            [ -f "$deb" ] && dpkg-deb -x "$deb" extracted/ 2>/dev/null
          done
          find extracted -name "*.dylib" -exec cp {} . \; 2>/dev/null
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: output/*
